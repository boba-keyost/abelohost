version: '3.7'

services:
  mysql:
    image: mysql:8.0
    command: mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: probe
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - '3306:3306'
    volumes:
      - './build/mysql/data:/var/lib/mysql'
      - './build/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf'

  app:
    build:
      dockerfile: build/docker/app.Dockerfile
    working_dir: /var/www/html
    environment:
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG?}
    security_opt:
      - "seccomp:unconfined"
    cap_add:
      - SYS_PTRACE
    ports:
      - "8080:8080"
      - "9013:9003"
    volumes:
      - './app:/var/www/html'
      - ./build/php/custom${PHP_INI_EXT}.ini:/etc/php85/conf.d/custom.ini
    restart: on-failure
    extra_hosts:
      - host.docker.internal:host-gateway